<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Wordtrail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400..700&display=swap">
<style>
/* Layout: mobile-first single column with a bottom tab bar; on desktop the nav becomes a left rail and content sits in a wide column. A winding trail map is the home screen. */
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --surface-2:#E2E7F3; --ink:#121633; --ink-2:#4B5377; --line:#CCD3E6;
  --brand:#3D4DFF; --brand-deep:#2331C4; --brand-wash:#E6E9FF; --on-brand:#FFFFFF;
  --sun:#F2780C; --sun-deep:#B85606;
  --good:#0E8F4F; --good-deep:#096B3A; --good-bg:#D9F4E5;
  --bad:#D6304A; --bad-deep:#A31F35; --bad-bg:#FCE1E5;
  --t1:#E6E9FF; --t2:#FFE8D3; --t3:#D9F4E5; --t4:#F8E2F2;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1021; --surface:#171B36; --surface-2:#20254A; --ink:#EEF0FF; --ink-2:#9AA2CC; --line:#2E3562;
    --brand:#7B87FF; --brand-deep:#4A56D0; --brand-wash:#252B63; --on-brand:#0D1021;
    --sun:#FFA24A; --sun-deep:#C7701F;
    --good:#3DDC91; --good-deep:#1FA566; --good-bg:#12392A;
    --bad:#FF6B80; --bad-deep:#C94559; --bad-bg:#43182A;
    --t1:#252B63; --t2:#4A2E17; --t3:#12392A; --t4:#4A1F42;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1021; --surface:#171B36; --surface-2:#20254A; --ink:#EEF0FF; --ink-2:#9AA2CC; --line:#2E3562;
  --brand:#7B87FF; --brand-deep:#4A56D0; --brand-wash:#252B63; --on-brand:#0D1021;
  --sun:#FFA24A; --sun-deep:#C7701F;
  --good:#3DDC91; --good-deep:#1FA566; --good-bg:#12392A;
  --bad:#FF6B80; --bad-deep:#C94559; --bad-bg:#43182A;
  --t1:#252B63; --t2:#4A2E17; --t3:#12392A; --t4:#4A1F42;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--f-body);padding-inline:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,5vw,2.5rem);font-weight:700}
h2{font-size:1.5rem;font-weight:700}
p{margin:0}
.sub{color:var(--ink-2);margin-top:6px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* shell */
.shell{max-width:1080px;margin-inline:auto}
.side{display:flex;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font:700 1.35rem var(--f-display)}
.brand .ic{width:30px;height:30px;color:var(--brand);stroke-width:2.2}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;border:0;background:none;color:var(--ink-2);font:600 .72rem var(--f-body)}
.nav-btn[aria-current="page"]{color:var(--brand);background:var(--brand-wash)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);color:var(--ink-2)}
.icon-btn:active{transform:translateY(1px)}
.sound{position:relative}
.side-tools{display:flex;gap:8px}
.sound.off::after{content:'';position:absolute;width:26px;height:2.5px;background:var(--bad);border-radius:2px;transform:rotate(-45deg)}
.main{padding-block:8px 110px;min-width:0}
.view{animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
.chips,.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:500 .8rem var(--f-mono)}
.chip .ic{width:16px;height:16px;color:var(--sun)}
@media (min-width:860px){
  .shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;padding-block:20px}
  .side{position:sticky;top:20px;align-self:start;flex-direction:column;align-items:stretch;gap:28px;padding-block:8px;height:calc(100vh - 40px)}
  .nav{position:static;display:flex;flex-direction:column;padding:0;background:none;border:0;gap:6px}
  .nav-btn{flex-direction:row;gap:12px;padding:12px 14px;font-size:.98rem;justify-content:flex-start;border-radius:14px}
  .side-tools{margin-top:auto}
  .main{padding-block:28px 60px}
}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;border:0;background:var(--brand);color:var(--on-brand);font:700 .98rem var(--f-body);box-shadow:0 4px 0 var(--brand-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);padding:10px 16px}
.btn.ghost:active{box-shadow:0 0 0 var(--line);transform:translateY(3px)}
.btn.good{background:var(--good);box-shadow:0 4px 0 var(--good-deep)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-deep)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld>span{font:600 .85rem var(--f-body)}
.fld small{color:var(--ink-2);font-size:.78rem}
input[type=text],input:not([type]),textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);min-width:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
textarea{resize:vertical}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),var(--sun));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.sm{height:7px}
.seg-ctl{display:inline-flex;flex-wrap:wrap;padding:3px;border-radius:12px;background:var(--surface-2);gap:2px}
.seg-ctl button{border:0;background:none;padding:7px 14px;border-radius:9px;font:600 .85rem var(--f-body);color:var(--ink-2)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.empty{padding:28px 20px;border:2px dashed var(--line);border-radius:var(--r-card,20px);text-align:center;color:var(--ink-2)}

/* trail */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:20px;border-radius:24px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.lv{width:84px;height:84px;border-radius:22px;background:var(--brand);color:var(--on-brand);display:grid;place-content:center;text-align:center;box-shadow:0 5px 0 var(--brand-deep)}
.lv small{font:500 .62rem var(--f-mono);letter-spacing:.14em}
.lv b{font:700 2.3rem/1 var(--f-display)}
.hero-t{display:flex;flex-direction:column;gap:8px;min-width:0}
.hero-t p{color:var(--ink-2);font-size:.9rem}
.hero-xp{text-align:right}
.hero-xp b{display:block;font:700 1.8rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.hero-xp small{font:500 .7rem var(--f-mono);color:var(--ink-2);letter-spacing:.08em}
@media (max-width:520px){.hero{grid-template-columns:auto minmax(0,1fr)}.hero-xp{display:none}.lv{width:68px;height:68px}.lv b{font-size:1.9rem}}
.trail{position:relative;isolation:isolate;margin-top:10px}
.trail .map{position:absolute;left:0;top:0;overflow:visible}
.seg{fill:none;stroke-linecap:round}
.seg.track{stroke:var(--line);stroke-width:5;stroke-dasharray:1 13}
.seg.fill{stroke:var(--brand);stroke-width:7;filter:drop-shadow(0 0 7px var(--brand));animation:draw 1s ease-out both}
@keyframes draw{from{stroke-dasharray:0 1}}
.tw{position:absolute;border-radius:50%;background:var(--brand);opacity:0;animation:tw 3.4s ease-in-out infinite;z-index:-1}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.55;transform:scale(1)}}
.node{position:absolute;width:128px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transform:translate(-50%,-28px)}
.node b{font:700 .92rem var(--f-display)}
.node small{font:500 .7rem var(--f-mono);color:var(--ink-2)}
.dot{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);color:var(--ink-2);box-shadow:0 5px 0 var(--line);position:relative}
.node.done .dot{background:var(--brand);border-color:var(--brand-deep);color:var(--on-brand);box-shadow:0 5px 0 var(--brand-deep)}
.node.now .dot{width:68px;height:68px;margin-block:-6px;background:var(--sun);border-color:var(--sun-deep);color:#fff;box-shadow:0 6px 0 var(--sun-deep);animation:bob 2.2s ease-in-out infinite}
.node.now .dot::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--sun);opacity:0;animation:ring 2.2s ease-out infinite}
.node.locked{opacity:.8}
.you{position:absolute;top:-34px;padding:3px 10px;border-radius:99px;background:var(--ink);color:var(--bg);font:600 .68rem var(--f-mono);letter-spacing:.08em;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes ring{0%{opacity:.8;transform:scale(.85)}100%{opacity:0;transform:scale(1.45)}}

/* home */
.chip.flame .ic{animation:flick 1.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.15) rotate(-6deg)}60%{transform:scale(.95) rotate(5deg)}}
.ring.sm{width:116px;height:116px;flex:none}
.ring .fg.full{stroke:var(--good);filter:drop-shadow(0 0 6px var(--good))}
.goal-in{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big{font:700 2rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.big small{font:500 .9rem var(--f-mono);color:var(--ink-2)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.wd small{font:500 .68rem var(--f-mono);color:var(--ink-2)}
.wc{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--on-brand)}
.wc .ic{width:18px;height:18px;stroke-width:3}
.wd.on .wc{background:var(--good);animation:pop .5s both}
.wd.today .wc{outline:3px solid var(--brand);outline-offset:2px}
.wd.today small{color:var(--brand)}
.wk{background:var(--surface-2);border-color:transparent;font-family:var(--f-body);font-weight:600}
.wk small{font-size:.7rem;color:var(--bad)}
.lvls{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 12px}
.lp{flex:none;min-width:128px;display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:16px;background:var(--surface-2);color:var(--ink-2)}
.lp b{font:700 .92rem var(--f-display);color:var(--ink)}
.lp small{font:500 .7rem var(--f-mono)}
.lp .ic{width:18px;height:18px}
.lp.done{background:var(--brand-wash);color:var(--brand)}
.lp.now{background:var(--sun);color:#fff;box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--sun);animation:glow 2.4s ease-in-out infinite}
.lp.now b{color:#fff}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--bg),0 0 0 9px var(--sun);}}

/* decks */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 22px;padding-bottom:20px}
.deck{position:relative;isolation:isolate;padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;transition:transform .15s}
.deck:hover{transform:translateY(-3px)}
.deck::before,.deck::after{content:'';position:absolute;inset:0;border-radius:inherit;border:1px solid var(--line);z-index:-1}
.deck::before{background:var(--surface);transform:translateY(7px) scale(.96)}
.deck::after{background:var(--surface-2);transform:translateY(14px) scale(.92);z-index:-2}
.deck h3{font-size:1.25rem;font-weight:700}
.deck .meta{display:flex;justify-content:space-between;font:500 .78rem var(--f-mono);color:var(--ink-2)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--brand-wash);color:var(--brand);font:600 .7rem var(--f-mono);letter-spacing:.04em;align-self:flex-start}
.cards{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:12px}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.crow .w{font:700 1.2rem var(--f-display)}
.crow .t{color:var(--brand);font-weight:600}
.crow .m{color:var(--ink-2);font-size:.9rem;margin-top:2px}
.crow .ss{margin:8px 0 0;padding:0 0 0 14px;color:var(--ink-2);font-size:.88rem;font-style:italic}
.pt{display:block;font-style:normal;color:var(--brand);font-size:.84rem;margin-top:2px}em.pt{display:block;font-style:normal;color:var(--brand);margin-top:2px}.pt-line{color:var(--brand)}.fb-t em{font-style:normal;opacity:.85}
.crow .st{font:500 .72rem var(--f-mono);color:var(--ink-2);margin-top:8px}
.crow .acts{display:flex;gap:6px}
.crow .acts .icon-btn{width:36px;height:36px}
.say-btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--brand-wash);color:var(--brand);display:grid;place-items:center;flex:none}
.say-btn:active{transform:scale(.94)}
@media (max-width:560px){.crow{grid-template-columns:auto minmax(0,1fr)}.crow .acts{grid-column:1/-1;justify-content:flex-end}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(8,10,28,.55)}
.panel{position:relative;width:min(100%,520px);max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:rise .25s ease both}
.panel h2{margin-bottom:16px}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:24px}}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font:600 .88rem var(--f-body);max-width:90vw;text-align:center}
.toast.in{animation:toast .3s ease both}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}}

/* play */
.ctl-row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:end;margin-bottom:22px}
.ctl-row .fld{margin:0;min-width:210px;flex:1 1 210px;max-width:340px}
.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dtools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:2px}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--brand);font:600 .85rem var(--f-body);text-decoration:underline}
.dchip{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font:600 .9rem var(--f-body);box-shadow:0 3px 0 var(--line)}
.dchip[disabled]{opacity:.75;cursor:default}
.dchip .ic{width:16px;height:16px;stroke-width:3}
.dchip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.dchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand-deep);color:var(--on-brand);box-shadow:0 3px 0 var(--brand-deep)}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.gcard{display:flex;flex-direction:column;gap:12px;text-align:left;padding:20px;border-radius:22px;background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);transition:transform .1s,box-shadow .1s}
.gcard:hover:not([disabled]){border-color:var(--brand)}
.gcard:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.gcard[disabled]{opacity:.55;cursor:not-allowed}
.gico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center}
.gico .ic{width:28px;height:28px}
.g1 .gico{background:var(--t1);color:var(--brand)}.g2 .gico{background:var(--t2);color:var(--sun)}.g3 .gico{background:var(--t3);color:var(--good)}.g4 .gico{background:var(--t4);color:var(--bad)}
.gcard h3{font-size:1.2rem;font-weight:700}
.gcard p{color:var(--ink-2);font-size:.92rem}
.gcard .gs{font:500 .75rem var(--f-mono);color:var(--ink-2);margin-top:auto}

/* game overlay */
.game{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;overflow:hidden}
.game::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0}
.game.fx-bad::after{box-shadow:inset 0 0 130px 24px var(--bad);animation:vig .65s ease-out}
.game.fx-good::after{box-shadow:inset 0 0 130px 24px var(--good);animation:vig .65s ease-out}
@keyframes vig{0%{opacity:0}25%{opacity:.5}100%{opacity:0}}
.g-top{display:flex;align-items:center;gap:14px;width:100%;max-width:720px;margin-inline:auto}
.g-bar{flex:1;height:16px}
.combo{display:flex;align-items:center;gap:4px;color:var(--ink-2);font:600 1.05rem var(--f-mono);min-width:48px}
.combo.on{color:var(--sun)}
.combo.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.35)}}
.game.done .g-top{visibility:hidden}
.g-stage{flex:1;overflow:auto;display:flex;flex-direction:column;padding-block:20px 160px}
.qcard{position:relative;margin:auto;width:min(100%,640px);display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 20px;border-radius:26px;background:var(--surface);border:2px solid var(--line);text-align:center}
.qcard.good{border-color:var(--good);animation:pop .5s}
.qcard.bad{border-color:var(--bad);animation:shake .5s}
@keyframes pop{40%{scale:1.035}}
@keyframes shake{10%,90%{translate:-2px}20%,80%{translate:5px}30%,50%,70%{translate:-9px}40%,60%{translate:9px}}
.q-label{display:flex;align-items:center;gap:8px;font:600 .8rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.q-label .ic{width:16px;height:16px}
.q-word{font:700 clamp(2.2rem,9vw,3.4rem)/1.05 var(--f-display)}
.q-hint{color:var(--ink-2);font-size:.95rem}
.q-sent{font:600 clamp(1.3rem,5vw,1.7rem)/1.4 var(--f-display)}
.gap{display:inline-block;min-width:4.5ch;border-bottom:4px solid var(--brand);margin-inline:4px;color:var(--brand)}
.qcard.good .gap{color:var(--good);border-color:var(--good)}
.hintchip{padding:5px 12px;border-radius:99px;background:var(--brand-wash);color:var(--brand);font:600 .85rem var(--f-body)}
.hint-box{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.hint-menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;animation:rise .2s ease both}
.hopt{padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:600 .9rem var(--f-body);text-align:left}
.hopt:hover:not([disabled]){border-color:var(--brand)}
.hopt[disabled]{opacity:.45;cursor:default}
.hopt:active:not([disabled]){transform:translateY(1px)}
.hint-note{grid-column:1/-1;color:var(--ink-2);font-size:.78rem;text-align:left}
.hint-out{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%}
.hint-out li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:10px 14px;border-radius:14px;background:var(--brand-wash);text-align:left;animation:rise .25s ease both}
.hint-out li>span{font:600 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.hint-out i{font-style:normal;font-weight:600}
.hint-out small{color:var(--ink-2);font-size:.78rem}
.lt{letter-spacing:.18em;font-size:1.1rem;overflow-wrap:anywhere}
.say{position:relative;width:104px;height:104px;border-radius:50%;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 6px 0 var(--brand-deep)}
.say .ic{width:44px;height:44px}
.say:active{transform:translateY(4px);box-shadow:0 2px 0 var(--brand-deep)}
.say.talking::before,.say.talking::after{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid var(--brand);animation:ring 1.2s ease-out infinite}
.say.talking::after{animation-delay:.5s}
.ans{display:flex;gap:10px;width:100%;flex-wrap:wrap}
.ans-in{flex:1 1 200px;font-size:1.35rem;text-align:center;padding:14px;border-radius:16px;border-width:2px}
.ans-in.ok{border-color:var(--good);background:var(--good-bg)}
.ans-in.no{border-color:var(--bad);background:var(--bad-bg)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:16px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font:600 1.05rem var(--f-body)}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt kbd{font:500 .75rem var(--f-mono);width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink-2);flex:none}
.opt.good{border-color:var(--good);background:var(--good-bg);box-shadow:0 4px 0 var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad)}
.floatxp{position:absolute;top:10px;left:50%;font:700 1.3rem var(--f-display);color:var(--good);pointer-events:none;animation:floatup .95s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
.fb{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:slideup .28s cubic-bezier(.2,.9,.3,1.2) both}
.fb.good{background:var(--good-bg)}.fb.bad{background:var(--bad-bg)}
@keyframes slideup{from{transform:translateY(100%)}}
.fb-in{display:flex;align-items:center;gap:14px;max-width:720px;margin-inline:auto}
.fb-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--on-brand)}
.fb.good .fb-ic{background:var(--good)}.fb.bad .fb-ic{background:var(--bad)}
.fb-t{display:flex;flex-direction:column;flex:1;min-width:0}
.fb-t b{font:700 1.2rem var(--f-display)}
.fb.good b{color:var(--good)}.fb.bad b{color:var(--bad)}
.fb-t span{font-size:.92rem;overflow-wrap:anywhere}
@media (max-width:480px){.fb-in{flex-wrap:wrap}.fb-in .btn{width:100%}}
.results{margin:auto;width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.ring{width:150px;height:150px}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--brand);transform:rotate(-90deg);transform-origin:50% 50%;animation:ringin 1.1s ease-out both}
@keyframes ringin{from{stroke-dasharray:0 100}}
.ring text{font:700 28px var(--f-display);fill:var(--ink);text-anchor:middle}
.lvup{padding:12px 18px;border-radius:16px;background:var(--sun);color:#fff;font:700 1.1rem var(--f-display);animation:pop .8s .3s both}
.miss{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:8px;text-align:left}
.miss li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.miss li div{flex:1;min-width:0}
.miss small{color:var(--ink-2);display:block}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile{padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.tile b{display:block;font:700 2rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tile small{font:500 .72rem var(--f-mono);color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.panelc{padding:20px;border-radius:22px;background:var(--surface);border:1px solid var(--line);min-width:0}
.panelc h3{font-size:1.15rem;margin-bottom:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-bottom:16px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;align-items:end;height:150px}
.dcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;gap:2px;min-width:0}
.dcol .s{border-radius:5px 5px 2px 2px;min-height:0}
.dcol .c{background:var(--good)}.dcol .w{background:var(--bad)}.dcol .z{background:var(--surface-2);height:4px}
.dlab{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:6px;font:500 .64rem var(--f-mono);color:var(--ink-2);text-align:center}
.dlab .today{color:var(--brand);font-weight:500}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rank li:last-child{border:0}
.rk{font:500 .8rem var(--f-mono);color:var(--ink-2)}
.rank b{font-family:var(--f-display);font-size:1.05rem}
.rank small{color:var(--ink-2);margin-left:8px}
.rank .cnt{font:500 .85rem var(--f-mono);white-space:nowrap}
.rank .say-btn{width:36px;height:36px}
.rank.good .bar>i{background:var(--good)}.rank.bad .bar>i{background:var(--bad)}
.grow{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:10px;align-items:center;margin-bottom:12px;font-size:.9rem}
.grow .mono{text-align:right;font-size:.8rem}

/* listen */
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px;border-radius:18px;background:var(--surface);border:2px solid transparent;margin-bottom:10px}
.lrow.playing,.sent.playing{border-color:var(--brand);background:var(--brand-wash)}
.lrow b{font:700 1.15rem var(--f-display)}
.lrow .tr{color:var(--ink-2);margin-left:8px}
.sent{display:flex;gap:8px;align-items:flex-start;text-align:left;margin-top:6px;padding:7px 10px;border-radius:12px;border:2px solid transparent;background:var(--surface-2);font-size:.9rem;width:100%}
.sent .ic{width:16px;height:16px;margin-top:3px;color:var(--brand)}
.pt-say{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:3px 9px;border-radius:99px;border:0;background:var(--brand-wash);color:var(--brand);font:600 .72rem var(--f-mono)}
.pt-say .ic{width:13px;height:13px}
.sentrow{display:flex;align-items:flex-start;gap:6px}
.sentrow .sent{flex:1;min-width:0}
.sentrow .pt-say{margin:6px 0 0;padding:9px 10px}
.eq{display:none;align-items:flex-end;gap:2px;height:14px}
.playing .eq{display:inline-flex}
.eq i{width:3px;background:var(--brand);border-radius:2px;animation:eq .7s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<canvas id="fx" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100"></canvas>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const uid=()=>Math.random().toString(36).slice(2,9);
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const KEY='wordtrail.v1';

/* ---------- state ---------- */
const PT={
journey:['A viagem até as montanhas levou seis horas.','Aprender um idioma é uma longa jornada.'],
borrow:['Posso pegar sua caneta emprestada?','Ela pegou um livro emprestado na biblioteca.'],
improve:['Quero melhorar meu inglês todos os dias.'],
ahead:['Siga em frente por dois quarteirões.'],
enough:['Temos tempo suficiente para terminar.','Isso é comida suficiente para todo mundo?'],
neighbor:['Meu vizinho tem um cachorro simpático.'],
through:['Atravessamos o parque a pé.'],
whisper:['Ela sussurrou um segredo no meu ouvido.'],
enjoy:['Eu curto cozinhar aos domingos.','Aproveite sua viagem!'],
schedule:['Minha agenda está cheia na segunda-feira.'],
though:['Estava frio, embora o sol estivesse aparecendo.'],
wonder:['Eu me pergunto que horas são.'],
cheap:['Este café é barato e gostoso.'],
lately:['Tenho andado cansado ultimamente.']
};
function seed(){const s=seed0();s.decks.forEach(d=>d.cards.forEach(c=>{c.sentsPt=(PT[c.word]||[]).slice();}));return s;}
function seed0(){
  const mk=(word,tr,meaning,sents)=>({id:uid(),word,tr,meaning,sents});
  return {v:1,xp:0,bestCombo:0,stats:{},games:{},days:{},
    prefs:{sound:true,accent:'en-US',rate:1,count:10,deck:'all',sents:true,showPt:false,readPt:false,ptVoice:''},
    decks:[{id:uid(),name:'Starter words',example:true,cards:[
      mk('journey','jornada, viagem','A long trip from one place to another.',['The journey to the mountains took six hours.','Learning a language is a long journey.']),
      mk('borrow','pegar emprestado','To take something and give it back later.',['Can I borrow your pen?','She borrowed a book from the library.']),
      mk('improve','melhorar','To become better, or to make something better.',['I want to improve my English every day.']),
      mk('ahead','à frente, adiante','In front, or further forward.',['Go straight ahead for two blocks.']),
      mk('enough','suficiente, bastante','As much as is needed.',['We have enough time to finish.','Is this enough food for everyone?']),
      mk('neighbor','vizinho','A person who lives near you.',['My neighbor has a friendly dog.']),
      mk('through','através de, por','From one side to the other.',['We walked through the park.']),
      mk('whisper','sussurrar','To speak very quietly.',['She whispered a secret in my ear.']),
      mk('enjoy','aproveitar, curtir','To get pleasure from something.',['I enjoy cooking on Sundays.','Enjoy your trip!']),
      mk('schedule','agenda, horário','A plan of times when things will happen.',['My schedule is full on Monday.']),
      mk('though','embora, apesar de','Despite the fact that.',['It was cold, though the sun was out.']),
      mk('wonder','imaginar, perguntar-se','To think about something with curiosity.',['I wonder what time it is.']),
      mk('cheap','barato','Costing little money.',['This cafe is cheap and tasty.']),
      mk('lately','ultimamente','In the recent past.',['I have been tired lately.'])
    ]}]};
}
function normalizeState(s){
  if(!s||typeof s!=='object'||!Array.isArray(s.decks))return null;
  const str=v=>typeof v==='string'?v:'';
  const num=v=>Number.isFinite(+v)&&+v>0?Math.floor(+v):0;
  const seen=new Set();
  s.decks=s.decks.filter(d=>d&&typeof d==='object').map(d=>{
    let id=str(d.id)||uid();if(seen.has(id))id=uid();seen.add(id);
    const cards=(Array.isArray(d.cards)?d.cards:[]).filter(c=>c&&typeof c==='object'&&str(c.word)&&str(c.tr)).map(c=>{
      const sents=(Array.isArray(c.sents)?c.sents:[]).map(str).filter(Boolean);
      let pt=Array.isArray(c.sentsPt)?c.sentsPt.map(str):null;
      if(!pt)pt=(PT[c.word]&&sents.length===PT[c.word].length)?PT[c.word].slice():[];
      return {id:str(c.id)||uid(),word:str(c.word),tr:str(c.tr),meaning:str(c.meaning),sents,sentsPt:pt};
    });
    return {id,name:str(d.name)||'Untitled deck',example:!!d.example,cards};
  });
  const p=Object.assign({sound:true,accent:'en-US',rate:1,count:10,sents:true,showPt:false,readPt:false,ptVoice:''},(s.prefs&&typeof s.prefs==='object')?s.prefs:{});
  p.sound=p.sound!==false;p.sents=p.sents!==false;p.showPt=!!p.showPt;p.readPt=!!p.readPt;p.ptVoice=str(p.ptVoice);
  if(p.accent!=='en-US'&&p.accent!=='en-GB')p.accent='en-US';
  p.rate=(+p.rate>0&&+p.rate<=2)?+p.rate:1;
  p.count=p.count==='all'?'all':(num(p.count)||10);
  const all=s.decks.map(d=>d.id);
  if(!Array.isArray(p.sel))p.sel=[];
  if(p.selV!==2){const prev=p.sel.filter(id=>all.includes(id));p.sel=prev.length?prev:all;p.selV=2;}
  p.sel=p.sel.filter(id=>all.includes(id));
  if(!['all','one','many'].includes(p.deckMode))p.deckMode=p.sel.length>=all.length?'all':(p.sel.length===1?'one':'many');
  delete p.deck;
  s.prefs=p;
  const cnt=o=>{const r={};if(o&&typeof o==='object')Object.keys(o).forEach(k=>{const v=o[k];if(v&&typeof v==='object')r[k]={c:num(v.c),w:num(v.w)};});return r;};
  s.stats=cnt(s.stats);s.games=cnt(s.games);
  const days={};if(s.days&&typeof s.days==='object')Object.keys(s.days).forEach(k=>{const v=s.days[k];if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&v&&typeof v==='object')days[k]={c:num(v.c),w:num(v.w),xp:num(v.xp)};});
  s.days=days;s.xp=num(s.xp);s.bestCombo=num(s.bestCombo);s.v=1;
  return s;
}
let state;
try{const raw=localStorage.getItem(KEY);state=normalizeState(raw?JSON.parse(raw):null);}catch(e){state=null;}
if(!state)state=normalizeState(seed());
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

const ui={deck:null,listenDeck:'all',playing:false};
const LEVELS=[
  {n:'Trailhead',xp:0,x:50},{n:'First Steps',xp:40,x:30},{n:'Word Collector',xp:120,x:70},
  {n:'Sharp Ears',xp:250,x:28},{n:'Sentence Builder',xp:420,x:72},{n:'Steady Pace',xp:650,x:32},
  {n:'Clear Speaker',xp:950,x:68},{n:'Wordsmith',xp:1350,x:30},{n:'Summit Camp',xp:1850,x:70},{n:'Fluent Peak',xp:2500,x:50}
];
const lvlOf=xp=>{let i=0;LEVELS.forEach((l,k)=>{if(xp>=l.xp)i=k;});return i;};
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayAct=k=>{const r=state.days[k];return r?r.c+r.w:0;};
function streak(){const d=new Date();let n=0;if(!dayAct(dkey(d)))d.setDate(d.getDate()-1);while(dayAct(dkey(d))>0){n++;d.setDate(d.getDate()-1);}return n;}
const st=id=>state.stats[id]||{c:0,w:0};
const allCards=()=>state.decks.flatMap(d=>d.cards.map(c=>Object.assign({},c,{deck:d.id})));
const getDeck=id=>state.decks.find(d=>d.id===id);
const isMastered=c=>{const s=st(c.id);return s.c>=3&&s.c/(s.c+s.w)>=.75;};
function poolCards(deckId){
  const tag=d=>d.cards.map(c=>Object.assign({},c,{deck:d.id}));
  if(deckId!==undefined){const d=getDeck(deckId);return d?tag(d):allCards();}
  const ids=state.prefs.sel||[];
  return state.decks.filter(d=>ids.includes(d.id)).flatMap(tag);
}

/* ---------- text helpers ---------- */
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const variants=c=>c.tr.split(/[,;\/]/).map(norm).filter(Boolean);
const firstTr=c=>(c.tr.split(/[,;\/]/)[0]||'').trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function blankSentence(sent,word){
  const w=word.trim();if(!w)return null;
  const e=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  let m=new RegExp('(^|[^A-Za-z])('+e+')(?![A-Za-z])','i').exec(sent);
  if(!m)m=new RegExp('(^|[^A-Za-z])('+e+'[A-Za-z]*)','i').exec(sent);
  if(!m)return null;
  const idx=m.index+m[1].length,found=m[2];
  return {before:sent.slice(0,idx),after:sent.slice(idx+found.length),answer:found};
}
const usableSentences=c=>(c.sents||[]).filter(s=>blankSentence(s,c.word));

/* ---------- sound effects ---------- */
let ac;
function tone(f,t0,d,type,v){
  const t=ac.currentTime+t0,o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v||.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03);
}
function sfx(k){
  if(!state.prefs.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    if(k==='ok'){tone(660,0,.14,'triangle');tone(990,.09,.24,'triangle');}
    else if(k==='bad'){tone(200,0,.22,'sawtooth',.07);tone(140,.13,.32,'sawtooth',.07);}
    else if(k==='level'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.34,'triangle'));}
  }catch(e){}
}

/* ---------- particles ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function sizeFx(){const r=window.devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0);}
addEventListener('resize',sizeFx);sizeFx();
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function burst(x,y,n,o){
  if(RM.matches)return;o=o||{};
  const cols=o.colors||[cssv('--brand'),cssv('--sun'),cssv('--good'),cssv('--ink-2')];
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*(o.spread||10),vy:-(Math.random()*8+3)*(o.up||1),g:.3,s:Math.random()*6+3,rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1,decay:.011+Math.random()*.01,c:cols[i%cols.length],sh:Math.random()<.5});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of parts){
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.rot+=p.vr;p.life-=p.decay;
    cx.save();cx.globalAlpha=Math.max(p.life,0);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
    if(p.sh)cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);else{cx.beginPath();cx.arc(0,0,p.s/2,0,7);cx.fill();}
    cx.restore();
  }
  if(parts.length)raf=requestAnimationFrame(tick);else{raf=0;cx.clearRect(0,0,innerWidth,innerHeight);}
}

/* ---------- speech ---------- */
const speechOK='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
let voices=[];
if(speechOK){const lv=()=>{voices=speechSynthesis.getVoices();};lv();speechSynthesis.onvoiceschanged=()=>{lv();if(typeof tab!=='undefined'&&tab==='listen'&&!ui.playing&&!document.activeElement.matches('select'))rListen();};}
function voiceScore(v){
  const n=v.name.toLowerCase();let sc=0;
  if(/natural|neural|online|premium|enhanced|siri/.test(n))sc+=6;
  if(/google/.test(n))sc+=3;
  if(/francisca|antonio|thalita|luciana|camila|vitoria|samantha|aria|jenny|guy|ava|daniel/.test(n))sc+=2;
  if(!v.localService)sc+=1;
  return sc;
}
function voicesFor(lang){
  const want=lang.toLowerCase(),base=want.split('-')[0];
  const exact=voices.filter(v=>v.lang.replace('_','-').toLowerCase()===want);
  const loose=voices.filter(v=>v.lang.toLowerCase().startsWith(base)&&!exact.includes(v));
  const byScore=(x,y)=>voiceScore(y)-voiceScore(x);
  return exact.sort(byScore).concat(loose.sort(byScore));
}
function pickVoice(lang){
  const l=lang||state.prefs.accent;
  const list=voicesFor(l);
  if(l.toLowerCase().startsWith('pt')&&state.prefs.ptVoice){const chosen=voices.find(v=>v.name===state.prefs.ptVoice);if(chosen)return chosen;}
  return list[0]||null;
}
function speak(text,rate,lang){
  if(!speechOK)return Promise.resolve();
  return new Promise(res=>{
    let done=false;const fin=()=>{if(!done){done=true;res();}};
    try{speechSynthesis.cancel();}catch(e){}
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(text);
      u.lang=lang||state.prefs.accent;const v=pickVoice(lang);if(v)u.voice=v;
      u.rate=rate||state.prefs.rate||1;
      u.onend=fin;u.onerror=fin;
      speechSynthesis.speak(u);
      setTimeout(fin,Math.max(2500,text.length*200/(u.rate||1)));
    },40);
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;t.classList.remove('in');void t.offsetWidth;t.classList.add('in');clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2800);}

  if(id==='pick'){const u=new Set(allCards().map(c=>norm(firstTr(c))));return u.size>=2?'':'Needs at least 2 different translations';}

/* ---------- game engine ---------- */
let G=null;
function weighted(src,k){
  const out=[];let bag=[];
  while(out.length<k){
    if(!bag.length)bag=src.slice();
    const ws=bag.map(c=>{const s=st(c.id);return Math.max(.4,1+s.w*1.5-Math.min(s.c,6)*.12);});
    let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;
    while(i<ws.length-1&&(r-=ws[i])>0)i++;
    const c=bag.splice(i,1)[0];
    if(out.length&&out[out.length-1].id===c.id&&bag.length){bag.push(c);continue;}
    out.push(c);
  }
  return out;
}
function pickOptions(c){
  const right=firstTr(c),vs=variants(c),bad=[];
  for(const o of shuffle(allCards())){
    if(o.id===c.id)continue;const t=firstTr(o);
    if(!t||vs.includes(norm(t))||bad.some(b=>norm(b)===norm(t)))continue;
    bad.push(t);if(bad.length===3)break;
  }
  const opts=shuffle([right].concat(bad));
  return {options:opts,correct:opts.indexOf(right)};
}
function buildQuestions(id,src){
  const k=state.prefs.count==='all'?src.length:Math.max(1,+state.prefs.count||10);
  return weighted(src,k).map(c=>{
    if(id==='listen')return {card:c,answers:[c.word]};
    if(id==='write')return {card:c,answers:variants(c)};
    if(id==='pick')return Object.assign({card:c},pickOptions(c));
    const ix=shuffle((c.sents||[]).map((x,i)=>i).filter(i=>blankSentence(c.sents[i],c.word)))[0],s=c.sents[ix],bl=blankSentence(s,c.word);
    return {card:c,bl,sentence:s,pt:(c.sentsPt&&c.sentsPt[ix])||'',answers:[bl.answer,c.word]};
  });
}
function startGame(id){
  const g=GAMES.find(x=>x.id===id);let src=poolCards();
  if(id==='fill')src=src.filter(c=>usableSentences(c).length);
  if(!src.length)return;
  G={id,g,qs:buildQuestions(id,src),i:0,ok:0,bad:0,combo:0,best:0,xp:0,missed:[],answered:false,lvl0:lvlOf(state.xp)};
  const gm=$('#game');gm.classList.remove('done');gm.hidden=false;
  document.documentElement.style.overflow='hidden';
  setCombo(0,false);renderQ();
}
function setCombo(n,bump){

}
function inputHTML(ph){return `<form class="ans" id="ans-form"><input id="ans" class="ans-in" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Your answer" placeholder="${ph}"><button class="btn" type="submit">Check</button></form>`;}

function sayQ(rate){const b=$('#say-q');if(b)b.classList.add('talking');speak(G.qs[G.i].card.word,rate).then(()=>{const x=$('#say-q');if(x)x.classList.remove('talking');});}
function hintBox(){
  return `<div class="hint-box"><button type="button" class="btn ghost sm" id="hint-btn" data-act="hint-menu" aria-expanded="false" aria-controls="hint-menu">${ic('star')} Ask for a hint</button>

function refreshHints(q){

function hintTarget(q){
  const c=q.card;

}
function hintPt(q){
  const c=q.card;
  if(G.id==='fill')return q.pt?{t:q.pt}:{t:firstTr(c),n:'No sentence translation saved, so this is the word.'};
  const pt=(c.sentsPt||[]).find(Boolean);

function hintsHTML(q){

  if(h.len)out.push(`<li><span>Length</span><b class="mono lt">${masked(0)}</b><small>${ans.replace(/ /g,'').length} letters${/ /.test(ans)?' in '+ans.split(' ').length+' words':''}</small></li>`);
  if(h.pt){const p=hintPt(q);out.push(`<li><span>In Portuguese</span><i>${esc(p.t)}</i>${p.n?`<small>${esc(p.n)}</small>`:''}</li>`);}
  if(h.last2)out.push(`<li><span>Ends with</span><b class="mono lt">…${esc(ans.slice(-2))}</b></li>`);
  if(h.k)out.push(`<li><span>Letters</span><b class="mono lt">${masked(h.k)}</b></li>`);

}
function check(val,idx){
  if(!G||G.answered)return;
  const q=G.qs[G.i];let ok=false,note='';
  if(G.id==='pick'){ok=idx===q.correct;}
  else{
    const v=norm(val);if(!v)return;
    ok=q.answers.some(a=>norm(a)===v);
    if(!ok&&G.id==='write'){const hit=q.answers.find(a=>a.length>=7&&lev(a,v)===1);if(hit){ok=true;note='Small typo, but we counted it.';}}
  }
  G.answered=true;resolveQ(ok,q,val,idx,note);
}
function resolveQ(ok,q,val,idx,note){
  const c=q.card,card=$('#qcard'),gm=$('#game'),last=G.i===G.qs.length-1;
  let gain=0;
  if(ok){G.ok++;G.combo++;G.best=Math.max(G.best,G.combo);gain=10+(G.combo%5===0?5:0);if(q.used)gain=Math.ceil(gain/2);G.xp+=gain;}
  else{G.bad++;G.combo=0;G.missed.push(c);}
  record(c.id,ok,gain);setCombo(G.combo,ok);
  const inp=$('#ans');if(inp){inp.readOnly=true;inp.classList.add(ok?'ok':'no');}
  const sub=$('#ans-form .btn');if(sub)sub.disabled=true;
  const hb=$('#hint-btn');if(hb)hb.disabled=true;const hm=$('#hint-menu');if(hm)hm.hidden=true;if(hb)hb.setAttribute('aria-expanded','false');
  if(G.id==='pick'){$$('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('good');else if(i===idx)b.classList.add('bad');});}
  card.classList.add(ok?'good':'bad');

  sfx(ok?'ok':'bad');

  if(ok){
    burst(r.left+r.width/2,r.top+r.height*.4,G.combo%5===0?70:26,{spread:G.combo%5===0?15:9});
    const f=document.createElement('span');f.className='floatxp';f.textContent='+'+gain+' XP';card.appendChild(f);

  }else{

  }

  const ptx=(G.id==='fill'&&q.pt)?'<br><em>'+esc(q.pt)+'</em>':'';
  const detail=ok?(note||(G.id==='fill'?esc(q.sentence)+ptx:(c.meaning?esc(c.meaning):'+'+gain+' XP'))):'Answer: <strong>'+esc(answer)+'</strong>'+(G.id==='listen'?' · '+esc(firstTr(c)):'')+ptx;
  const fb=$('#fb');fb.className='fb '+(ok?'good':'bad');fb.hidden=false;
  fb.style.animation='none';void fb.offsetWidth;fb.style.animation='';
  fb.innerHTML=`<div class="fb-in"><span class="fb-ic">${ic(ok?'check':'close')}</span><div class="fb-t"><b>${ok?praise:'Not quite'}</b><span>${detail}</span></div>
    <button class="btn ${ok?'good':'bad'}" id="next" data-act="next">${last?'Finish':'Continue'}</button></div>`;

}
function record(id,ok,gain){
  const s=state.stats[id]||(state.stats[id]={c:0,w:0});ok?s.c++:s.w++;

    <div><h2>${G.bad===0?'Perfect round!':acc>=70?'Great round!':'Round done'}</h2><p class="sub">${G.ok} of ${total} right${G.best>1?` · best streak ${G.best}`:''}</p></div>

}

  const words=st.decks.reduce((n,d)=>n+d.cards.length,0),ans=Object.values(st.days).reduce((n,d)=>n+d.c+d.w,0);
  box.hidden=false;bkMsg('');
  box.innerHTML=`<div class="panelc" style="margin-top:14px"><h3 style="margin-bottom:8px">Backup found</h3>
    <p class="sub" style="margin:0 0 12px">${st.decks.length} deck${st.decks.length===1?'':'s'} · ${words} words · ${st.xp} XP · ${ans} answers${r.at?` · saved ${esc(String(r.at).slice(0,10))}`:''}</p>
    <div class="row-btns"><button class="btn bad" data-act="backup-replace">Replace my data</button><button class="btn ghost" data-act="backup-merge">Add decks, keep my progress</button></div>
    <p class="sub" style="margin:10px 0 0;font-size:.82rem">Replace swaps everything you have now for the backup. Add decks brings in the backup's decks and words and keeps your current progress.</p></div>`;
}
function afterRestore(msg){save();syncSound();closeSheet();render();toast(msg);}

/* ---------- events ---------- */
const armed=new Map();
function twoStep(btn,fn){
  if(armed.get(btn)){armed.delete(btn);fn();return;}
  const old=btn.innerHTML;armed.set(btn,1);
  if(btn.classList.contains('icon-btn'))btn.style.borderColor='var(--bad)';
  else btn.textContent='Tap again to confirm';
  toast('Tap again to confirm');
  setTimeout(()=>{if(armed.get(btn)){armed.delete(btn);btn.innerHTML=old;btn.style.borderColor='';}},3000);
}
const ACTIONS={
  settings(){openSettings();},
  async 'backup-save'(){
    const dl=await getDownloads();
    if(!dl){bkMsg('Saving a file is not available in this view. Use "Copy as text" instead.',true);return;}
    try{await dl.save({filename:'wordtrail-backup-'+dkey()+'.json',data:backupJSON()});bkMsg('Backup ready. Keep the file somewhere safe.');}
    catch(e){bkMsg(e&&e.code==='declined'?'Save cancelled.':'Could not save the file. Try "Copy as text".',true);}
  },
  'backup-copy'(){
    const text=backupJSON(),out=$('#bk-out'),show=()=>{out.hidden=false;out.value=text;out.focus();out.select();};
    try{navigator.clipboard.writeText(text).then(()=>bkMsg('Backup text copied. Paste it into a note or message to keep it.'),()=>{show();bkMsg('Select the text above and copy it.');});}
    catch(e){show();bkMsg('Select the text above and copy it.');}
  },
  'backup-check'(){previewBackup($('#bk-text').value);},
  'backup-replace'(b){
    twoStep(b,()=>{if(!ui.pending)return;state=ui.pending;ui.pending=null;ui.deck=null;afterRestore('Backup restored');});
  },
  'backup-merge'(){
    const imp=ui.pending;if(!imp)return;
    let addedDecks=0,addedWords=0;
    imp.decks.forEach(d=>{
      const ex=getDeck(d.id);
      if(ex){d.cards.forEach(c=>{if(!ex.cards.some(x=>x.id===c.id)){ex.cards.push(c);addedWords++;}});}
      else{state.decks.push(d);addedDecks++;addedWords+=d.cards.length;if(state.prefs.deckMode==='all')state.prefs.sel.push(d.id);}
    });
    Object.keys(imp.stats).forEach(id=>{if(!state.stats[id])state.stats[id]=imp.stats[id];});
    ui.pending=null;afterRestore(`Added ${addedDecks} deck${addedDecks===1?'':'s'} and ${addedWords} words`);
  },
  sound(){state.prefs.sound=!state.prefs.sound;save();syncSound();if(state.prefs.sound)sfx('ok');},
  'new-deck'(){deckForm(null);},
  'open-deck'(b){ui.deck=b.dataset.id;rDecks();window.scrollTo(0,0);},
  'play-deck'(b){state.prefs.sel=[b.dataset.id];state.prefs.deckMode='one';save();go('play');},
  'go-decks'(){go('decks');},
  'deck-mode'(b){
    const v=b.dataset.v,all=state.decks.map(d=>d.id),cur=(state.prefs.sel||[]).filter(id=>all.includes(id));
    state.prefs.deckMode=v;
    if(v==='all')state.prefs.sel=all;
    else if(v==='one')state.prefs.sel=[cur[0]||all[0]].filter(Boolean);
    else state.prefs.sel=cur.length?cur:all;
    save();rPlay();
  },
  'deck-all'(){state.prefs.sel=state.decks.map(d=>d.id);save();rPlay();},
  'deck-none'(){state.prefs.sel=[];save();rPlay();},
  'deck-toggle'(b){
    const id=b.dataset.id;
    if(state.prefs.deckMode==='one')state.prefs.sel=[id];
    else{const cur=(state.prefs.sel||[]).slice(),i=cur.indexOf(id);if(i>=0)cur.splice(i,1);else cur.push(id);state.prefs.sel=cur;}
    save();rPlay();
  },
  'back-decks'(){ui.deck=null;rDecks();},
  'add-card'(){cardForm(null);},
  'edit-card'(b){const d=getDeck(ui.deck),c=d&&d.cards.find(x=>x.id===b.dataset.id);if(c)cardForm(c);},
  'del-card'(b){twoStep(b,()=>{const d=getDeck(ui.deck);d.cards=d.cards.filter(x=>x.id!==b.dataset.id);delete state.stats[b.dataset.id];save();rDecks();});},
  'rename-deck'(){deckForm(getDeck(ui.deck));},
  'del-deck'(b){twoStep(b,()=>{state.decks=state.decks.filter(d=>d.id!==ui.deck);state.prefs.sel=(state.prefs.sel||[]).filter(x=>x!==ui.deck);if(state.prefs.deckMode==='one'&&!state.prefs.sel.length&&state.decks[0])state.prefs.sel=[state.decks[0].id];ui.deck=null;save();rDecks();});},
  'close-sheet'(){closeSheet();},
  count(b){state.prefs.count=b.dataset.n==='all'?'all':+b.dataset.n;save();rPlay();},
  quick(){const pool=poolCards();const id=['pick','write','fill','listen'].find(g=>gameAvail(g,pool)==='');if(id)startGame(id);else{toast('Add words in Decks first');go('decks');}},
  start(b){startGame(b.dataset.game);},
  quit(){quitGame();},
  next(){next();},
  pick(b){check(null,+b.dataset.i);},
  'say-q'(){sayQ(1);},
  'say-slow'(){sayQ(.6);},
  say(b){
    if(ui.playing)stopListen();
    $$('.playing').forEach(e=>e.classList.remove('playing'));
    let t=b.closest('.speakable');
    if(!t&&b.previousElementSibling&&b.previousElementSibling.classList.contains('speakable'))t=b.previousElementSibling;
    if(t)t.classList.add('playing');
    speak(b.dataset.text,undefined,b.dataset.lang).then(()=>{if(t&&!ui.playing)t.classList.remove('playing');});
  },
  accent(b){state.prefs.accent=b.dataset.v;save();stopListen();rListen();},
  rate(b){state.prefs.rate=+b.dataset.v;save();stopListen();rListen();},
  'hint-menu'(){
    const m=$('#hint-menu');if(!m||!G||G.answered)return;
    m.hidden=!m.hidden;$('#hint-btn').setAttribute('aria-expanded',String(!m.hidden));
    if(!m.hidden)refreshHints(G.qs[G.i]);
  },
  hint(b){
    if(!G||G.answered)return;const q=G.qs[G.i];q.hints=q.hints||{};const t=b.dataset.h;
    let free=false;
    if(t==='k')q.hints.k=Math.min((q.hints.k||0)+1,Math.max(1,hintTarget(q).length-1));
    else{q.hints[t]=true;if(t==='pt'&&hintPt(q).free)free=true;}
    if(!free)q.used=(q.used||0)+1;
    refreshHints(q);
  },
  'show-pt'(){const l=$('#pt-line'),b=$('#pt-btn');if(!l)return;l.hidden=!l.hidden;b.textContent=(l.hidden?'Show':'Hide')+' sentence in Portuguese';state.prefs.showPt=!l.hidden;save();},
  showpt(b){state.prefs.showPt=b.dataset.v==='true';save();rListen();},
  readpt(b){state.prefs.readPt=b.dataset.v==='true';save();stopListen();rListen();},
  sents(b){state.prefs.sents=b.dataset.v==='true';save();rListen();},
  'play-all'(){playAll();}
};
document.addEventListener('click',e=>{
  const nb=e.target.closest('.nav-btn');if(nb){go(nb.dataset.tab);return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='open-deck'&&e.target.closest('[data-act="play-deck"]'))return;
  const f=ACTIONS[b.dataset.act];if(f)f(b);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.deck[data-act]')){e.preventDefault();ACTIONS['open-deck'](e.target);return;}
  if(G&&!G.answered&&G.id==='pick'&&/^[1-4]$/.test(e.key)){const i=+e.key-1;if(i<G.qs[G.i].options.length)check(null,i);}
});
document.addEventListener('change',e=>{
  if(e.target.id==='bk-file'){
    const f=e.target.files&&e.target.files[0];if(!f)return;
    if(f.size>8*1024*1024){bkMsg('That file is too large to be a Wordtrail backup.',true);return;}
    const rd=new FileReader();
    rd.onload=()=>{$('#bk-text').value=String(rd.result||'');previewBackup(rd.result);};
    rd.onerror=()=>bkMsg('Could not read that file.',true);
    rd.readAsText(f);return;
  }
  if(e.target.id==='sel-pt-voice'){state.prefs.ptVoice=e.target.value;save();speak('Olá! Esta é a minha voz em português.',undefined,'pt-BR');}
  if(e.target.id==='sel-listen-deck'){ui.listenDeck=e.target.value;stopListen();rListen();}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='ans-form'){check($('#ans').value);return;}
  if(f.id==='card-form'){
    const d=getDeck(ui.deck);if(!d)return;
    const word=$('#f-word').value.trim(),tr=$('#f-tr').value.trim();if(!word||!tr)return;
    const sents=$('#f-sents').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const sentsPt=$('#f-sentspt').value.split('\n').map(x=>x.trim());
    while(sentsPt.length&&!sentsPt[sentsPt.length-1])sentsPt.pop();
    const data={word,tr,meaning:$('#f-mean').value.trim(),sents,sentsPt};
    const cid=f.dataset.card,ex=cid&&d.cards.find(x=>x.id===cid);
    if(ex)Object.assign(ex,data);else d.cards.push(Object.assign({id:uid()},data));
    const lost=sents.filter(s=>!blankSentence(s,word)).length;
    save();closeSheet();rDecks();
    toast(lost?`Saved. ${lost} sentence${lost>1?'s do':' does'} not contain the word, so the gap game skips ${lost>1?'them':'it'}.`:'Word saved');
  }
  if(f.id==='deck-form'){
    const name=$('#f-dname').value.trim();if(!name)return;
    if(f.dataset.deck){const d=getDeck(f.dataset.deck);d.name=name;}
    else{const d={id:uid(),name,cards:[]};state.decks.push(d);if(state.prefs.deckMode==='all')state.prefs.sel=(state.prefs.sel||[]).concat(d.id);ui.deck=d.id;}
    save();closeSheet();rDecks();
  }
});

syncSound();go('path');
})();
</script>
